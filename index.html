<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frajola TV Player</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body>

    <!-- Header Navigation -->
    <header>
        <div class="brand">
            <img src="frajola.jpg" alt="Logo" onerror="this.style.display='none'">
            <span>Frajola <b>TV</b></span>
        </div>

        <nav class="top-nav">
            <button class="nav-btn active" id="btn-home" onclick="switchView('home')">Início</button>
            <button class="nav-btn" id="btn-live" onclick="switchView('live')">TV ao Vivo</button>
            <button class="nav-btn" id="btn-movies" onclick="switchView('movies')">Filmes</button>
            <button class="nav-btn" id="btn-series" onclick="switchView('series')">Séries</button>
        </nav>

        <div class="actions">
            <span id="status">● Desconectado</span>
            <button class="btn-connect" onclick="showUrl()">🔗 URL</button>
            <label class="filelabel">
                📁 Arquivo M3U
                <input type="file" id="file" accept=".m3u,.m3u8">
            </label>
            <button onclick="clearSavedList()" title="Limpar Lista">🗑️</button>
        </div>
    </header>

    <!-- Main Content Area -->
    <main>
        <!-- View 1: Home Panel -->
        <section id="view-home" class="view-panel active">
            <div class="hero-cards">
                <div class="hero-card" onclick="switchView('live')">
                    <div class="icon">📺</div>
                    <div class="title">TV ao Vivo</div>
                </div>
                <div class="hero-card" onclick="switchView('movies')">
                    <div class="icon">🎬</div>
                    <div class="title">Filmes</div>
                </div>
                <div class="hero-card" onclick="switchView('series')">
                    <div class="icon">🍿</div>
                    <div class="title">Séries</div>
                </div>
            </div>
        </section>

        <!-- View 2: Live TV Panel (3 Columns) -->
        <section id="view-live" class="view-panel">
            <div class="live-tv-container">
                <!-- Coluna 1: Categorias -->
                <div class="col-categories">
                    <div class="search-box">
                        <input type="text" id="liveSearchInput" placeholder="Buscar canal..." oninput="filterLiveChannels()">
                    </div>
                    <ul class="cat-list" id="liveCategoryList">
                        <!-- Categorias geradas por JS -->
                    </ul>
                </div>

                <!-- Coluna 2: Lista de Canais -->
                <div class="col-channels" id="channelList">
                    <!-- Canais gerados por JS -->
                </div>

                <!-- Coluna 3: Player de Video e Info -->
                <div class="col-player">
                    <div class="tv-player-wrapper">
                        <video id="livePlayer" controls autoplay></video>
                    </div>
                    <div class="epg-info">
                        <h3 id="currentChannelTitle">Selecione um canal</h3>
                        <p id="currentChannelSub" style="font-size: 12px; color: #94a3b8; margin-top: 4px;">Aguardando reprodução...</p>
                        <div class="epg-actions">
                            <button onclick="toggleFavCurrent()">⭐ Favoritar</button>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- View 3 & 4: Grid Content (Filmes e Séries) -->
        <section id="view-grid" class="view-panel">
            <div class="grid-header">
                <h2 id="gridTitle">Conteúdo</h2>
                <input type="text" id="gridSearchInput" placeholder="Buscar título..." oninput="filterGridContent()" style="padding: 6px 10px; background: #0f172a; border: 1px solid #1e293b; color: #fff; border-radius: 4px; font-size: 12px;">
            </div>
            <div class="vod-grid" id="vodGrid">
                <!-- Cards de Filmes e Séries organizados em grade gerados via JS -->
            </div>
        </section>
    </main>

    <!-- Dialog Modal para Inserir URL -->
    <dialog id="urlDialog" style="background: #0f172a; color: #fff; border: 1px solid #1e293b; border-radius: 8px; padding: 20px; margin: auto;">
        <h3 style="margin-bottom: 10px;">Inserir URL M3U</h3>
        <input type="text" id="url" placeholder="https://exemplo.com/lista.m3u" style="width: 100%; padding: 8px; background: #080c14; border: 1px solid #1e293b; color: #fff; border-radius: 4px; margin-bottom: 15px;">
        <div style="display: flex; gap: 10px; justify-content: flex-end;">
            <button onclick="document.getElementById('urlDialog').close()">Cancelar</button>
            <button class="btn-connect" onclick="loadUrl()">Carregar</button>
        </div>
    </dialog>

    <script src="script.js"></script>
</body>
</html>
