<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Frajola TV Player</title>

    <!-- PWA Settings -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#b91c1c">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="icon" type="image/jpeg" href="frajola.jpg">
    <link rel="apple-touch-icon" href="frajola.jpg">

    <!-- CSS Externo e HLS.js -->
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <!-- Firebase SDK (Para gerenciar contas e planos) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body>

    <!-- TELA DE LOGIN (Inicia visível se não estiver logado) -->
    <div id="loginOverlay" class="login-overlay">
        <div class="login-card">
            <h2>Frajola <b>TV</b></h2>
            <p>Entre com a sua conta para acessar o sistema</p>
            
            <div class="input-group">
                <input type="email" id="loginEmail" placeholder="E-mail ou Usuário">
            </div>
            <div class="input-group">
                <input type="password" id="loginPassword" placeholder="Senha">
            </div>
            
            <button class="btn-login-action" onclick="fazerLogin()">ACESSAR CONTA</button>
            <p id="loginError" class="login-error"></p>
        </div>
    </div>

    <!-- Header / Barra Superior (Só aparece após o login) -->
    <header>
        <div class="brand">
            <span>Frajola <b>TV</b></span>
        </div>

        <nav class="top-nav">
            <button class="nav-btn active" id="btn-home" onclick="switchView('home')">INÍCIO</button>
            <button class="nav-btn" id="btn-live" onclick="switchView('live')">TV</button>
            <button class="nav-btn" id="btn-destaques" onclick="switchView('destaques')">DESTAQUES</button>
            <button class="nav-btn" id="btn-movies" onclick="switchView('movies')">FILMES</button>
            <button class="nav-btn" id="btn-series" onclick="switchView('series')">SÉRIES</button>
            <button class="nav-btn" id="btn-kids" onclick="switchView('kids')">KIDS</button>
            <button class="nav-btn" id="btn-anime" onclick="switchView('anime')">ANIME</button>
        </nav>

        <div class="actions">
            <button class="btn-logout" onclick="fazerLogout()" title="Sair da Conta">🚪 Sair</button>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <main>
        <section id="view-home" class="view-panel active">
            <div class="hero-cards">
                <div class="hero-card" onclick="switchView('live')">
                    <div class="icon">📺</div>
                    <div class="title">TV ao Vivo</div>
                </div>
                <div class="hero-card" onclick="switchView('movies')">
                    <div class="icon">🎬</div>
                    <div class="title">Filmes</div>
                </div>
                <div class="hero-card" onclick="switchView('series')">
                    <div class="icon">🍿</div>
                    <div class="title">Séries</div>
                </div>
                <div class="hero-card" onclick="switchView('kids')">
                    <div class="icon">🎈</div>
                    <div class="title">Kids</div>
                </div>
                <div class="hero-card" onclick="switchView('anime')">
                    <div class="icon">⚔️</div>
                    <div class="title">Anime</div>
                </div>
            </div>
        </section>

        <section id="view-live" class="view-panel">
            <div class="live-tv-container">
                <div class="col-categories">
                    <div class="search-box">
                        <input type="text" id="liveSearchInput" placeholder="Pesquisar canal..." oninput="filterLiveChannels()">
                    </div>
                    <ul class="cat-list" id="liveCategoryList">
                        <li class="active" onclick="selectCategory('all', this)">
                            <span>Todos</span> <span class="badge" id="cat-count-all">0</span>
                        </li>
                        <li onclick="selectCategory('fav', this)">
                            <span>⭐ Favoritos</span> <span class="badge" id="cat-count-fav">0</span>
                        </li>
                    </ul>
                </div>

                <div class="col-channels" id="channelList">
                    <div class="empty">Carregando canais...</div>
                </div>

                <div class="col-player">
                    <div class="tv-player-wrapper">
                        <video id="livePlayer" controls autoplay playsinline></video>
                    </div>
                    <div class="epg-info">
                        <h3 id="currentChannelTitle">Selecione um canal</h3>
                        <p id="currentChannelSub" style="font-size: 12px; color: #94a3b8;">Nenhum canal em reprodução.</p>
                        <div class="epg-actions">
                            <button onclick="toggleFavCurrent()">⭐ Favoritar</button>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <section id="view-grid" class="view-panel">
            <!-- Grid dinâmico -->
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
